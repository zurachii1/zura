<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zura Links</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: single centered column, big red-on-black wordmark, three stacked link rows */
  :root {
    --bg: #0b0708;
    --surface: #170d0f;
    --surface-hi: #221215;
    --line: #34191d;
    --fg: #f6eeee;
    --muted: #a58f92;
    --red: #e11d2e;
    --red-hot: #ff3b4a;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(225, 29, 46, 0.22), transparent 70%),
      var(--bg);
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 56px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  header { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .mark {
    width: 96px; height: 96px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--red);
    color: var(--bg);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 44px;
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--red), 0 0 40px rgba(225, 29, 46, 0.45);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(36px, 11vw, 52px);
    letter-spacing: 0.04em;
    line-height: 1;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .tag { margin: 0; color: var(--muted); font-size: 15px; letter-spacing: 0.02em; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .row {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    min-height: 68px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--fg);
    text-decoration: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .row:hover { background: var(--surface-hi); border-color: var(--red); transform: translateY(-2px); }
  .row:focus-visible { outline: 2px solid var(--red-hot); outline-offset: 3px; }
  .ico {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--red); color: var(--bg);
  }
  .ico svg { width: 22px; height: 22px; display: block; }
  .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .name { font-weight: 600; font-size: 16px; }
  .handle { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .go { flex: none; color: var(--red-hot); font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  footer { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .row { transition: none; } .row:hover { transform: none; } }
</style>

<main>
  <header>
    <div class="mark" aria-hidden="true">Z</div>
    <h1>Zura</h1>
    <p class="tag">Find me everywhere</p>
  </header>

  <ul class="links">
    <li>
      <a class="row" href="https://youtube.com/@itszurachii" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5Z"/></svg>
        </span>
        <span class="txt"><span class="name">YouTube</span><span class="handle">@itszurachii</span></span>
        <span class="go">Watch</span>
      </a>
    </li>
    <li>
      <a class="row" href="https://www.tiktok.com/@zurachii1" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg>
        </span>
        <span class="txt"><span class="name">TikTok</span><span class="handle">@zurachii1</span></span>
        <span class="go">Follow</span>
      </a>
    </li>
    <li>
      <button class="row" id="discord" type="button" aria-describedby="discord-status">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
        </span>
        <span class="txt"><span class="name">Discord</span><span class="handle" id="discord-status">zurachii1</span></span>
        <span class="go" id="discord-go">Copy</span>
      </button>
    </li>
  </ul>

  <footer>© Zura</footer>
</main>

<script>
  (function () {
    var btn = document.getElementById("discord");
    var status = document.getElementById("discord-status");
    var go = document.getElementById("discord-go");
    var timer;
    function flash(label) {
      go.textContent = label;
      clearTimeout(timer);
      timer = setTimeout(function () { go.textContent = "Copy"; }, 1800);
    }
    function selectText() {
      try {
        var range = document.createRange();
        range.selectNodeContents(status);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } catch (e) {}
    }
    btn.addEventListener("click", function () {
      var done = function () { flash("Copied"); };
      var fail = function () { selectText(); flash("Select it"); };
      try {
        navigator.clipboard.writeText("zurachii1").then(done, fail);
      } catch (e) { fail(); }
    });
  })();
</script>

</body></html>
